<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="light dark" />
  <meta name="theme-color" content="#fafaf9" />
  <script>
    (() => {
      let preference = 'system';
      try { const saved = localStorage.getItem('afiliadodash.appearance'); if (['light', 'dark', 'system'].includes(saved)) preference = saved; } catch {}
      const theme = preference === 'system' ? (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : preference;
      document.documentElement.dataset.theme = theme;
      document.documentElement.dataset.appearance = preference;
      document.documentElement.classList.toggle('dark', theme === 'dark');
      document.documentElement.style.colorScheme = theme;
      document.querySelector('meta[name="theme-color"]').setAttribute('content', theme === 'dark' ? '#111113' : '#fafaf9');
    })();
  </script>
